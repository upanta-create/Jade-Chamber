apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jade-chamber-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: staging
    app.kubernetes.io/part-of: jade-chamber
spec:
  project: default
  source:
    repoURL: https://github.com/upanta-create/Jade-Chamber.git
    targetRevision: HEAD
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: jade-chamber-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
