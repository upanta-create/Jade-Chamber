apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jade-chamber-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: production
    app.kubernetes.io/part-of: jade-chamber
spec:
  project: default
  source:
    repoURL: https://github.com/upanta-create/Jade-Chamber.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: jade-chamber-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
