apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gocart-staging
namePrefix: staging-

resources:
  - ../../base

patches:
  - path: patch-env.yaml
    target:
      kind: ConfigMap
      name: gocart-config

images:
  - name: ghcr.io/upanta-create/jade-chamber
    newName: ghcr.io/upanta-create/jade-chamber
    newTag: "latest"
