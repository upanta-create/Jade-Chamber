apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gocart-ingress
  labels:
    app.kubernetes.io/name: gocart
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gocart-active
                port:
                  number: 80
